name: skill-forge

services:
  postgres:
    image: postgres:17
    container_name: skillforge-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: skillforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redisinsight:
    image: redis/redisinsight:latest
    container_name: skillforge-redisinsight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: skillforge-local
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:5540/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  pgwatch:
    image: cybertec/pgwatch2-postgres:latest
    container_name: skillforge-pgwatch
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PW2_ADHOC_CONN_STR: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PW2_ADHOC_NAME: ${POSTGRES_DB}
      PW2_ADHOC_CONFIG: skillforge
      PW2_DATASTORE: postgres
      PW2_WEBNOANONYMOUS: "true"
      PW2_WEBUSER: ${PGWATCH_WEB_USER}
      PW2_WEBPASSWORD: ${PGWATCH_WEB_PASSWORD}
      PW2_GRAFANAUSER: ${PGWATCH_GRAFANA_USER}
      PW2_GRAFANAPASSWORD: ${PGWATCH_GRAFANA_PASSWORD}
    volumes:
      - ./docker/pgwatch/preset-configs.yaml:/pgwatch2/metrics/preset-configs.yaml:ro
      - ./docker/pgwatch/stat_statements/17/metric.sql:/pgwatch2/metrics/stat_statements/17/metric.sql:ro
    ports:
      - "3001:3000"
      - "8088:8080"

volumes:
  postgres-data:
  redis-data:
  redisinsight-data:
